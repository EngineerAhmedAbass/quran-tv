name: Quran TV APK

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Quran-TV.apk
          # البرنامج بيقرا الملف ده عشان يعرف إن في نسخة جديدة
          V=$(( ${{ github.run_number }} + 100 ))
          echo "{\"versionCode\": $V}" > version.json

      - uses: actions/upload-artifact@v4
        with:
          name: Quran-TV-apk
          path: Quran-TV.apk

      # رابط ثابت لآخر نسخة: releases/download/latest/Quran-TV.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Quran-TV.apk version.json \
            --target "${{ github.sha }}" \
            --latest \
            --title "سورة البقرة للتليفزيون (نسخة $(( ${{ github.run_number }} + 100 )))" \
            --notes "نزّل Quran-TV.apk وسطّبه على التليفزيون (Android TV / Google TV)."
